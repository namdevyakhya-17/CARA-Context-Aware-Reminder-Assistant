<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CARA Reminder Console</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Context-Aware Reminder System</p>
            <h1>CARA Reminder Console</h1>
          </div>
          <label class="api-config">
            <span>API</span>
            <input id="apiBaseInput" type="url" value="http://127.0.0.1:8000">
          </label>
        </header>

        <div id="statusBanner" class="status-banner" role="status" hidden></div>

        <section id="reminderInput" class="panel"></section>

        <div class="grid">
          <section id="reminderPreview" class="panel"></section>
          <section id="missingFieldsForm" class="panel"></section>
        </div>

        <section id="locationTracker" class="panel"></section>

        <section id="reminderList" class="panel"></section>
      </section>
    </main>

    <div id="notificationCard"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
